<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal del administrador para gestionar matriculas.">
    <title>Administrador — Matriculas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="global-header">
        <div class="global-header-inner">
            <span class="global-logo">AF</span>
            <div>
                <h1 class="global-title">Portal del Administrador</h1>
            </div>
        </div>
    </header>

    <section class="login-panel" id="admin-login">
        <div class="login-card">
            <h2>Inicio de sesion</h2>
            <p>Acceso exclusivo para administradores.</p>
            <form id="form-admin-login" novalidate>
                <div class="campo">
                    <label for="admin-user">Usuario</label>
                    <input type="text" id="admin-user" placeholder="usuario" autocomplete="username">
                </div>
                <div class="campo">
                    <label for="admin-pass">Contrasena</label>
                    <input type="password" id="admin-pass" placeholder="contrasena" autocomplete="current-password">
                </div>
                <p class="login-error" id="admin-error"></p>
                <button type="submit" class="btn-login" id="btn-admin-login">Ingresar</button>
            </form>
        </div>
    </section>

    <div id="admin-content" class="oculto">
        <section class="admin-panel">
            <div class="admin-header">
                <div>
                    <h2>Gestion de matriculas</h2>
                    <p>CRUD de matriculas registradas.</p>
                </div>
                <div class="admin-actions">
                    <select id="admin-estado">
                        <option value="">Todos</option>
                        <option value="CONFIRMADA">Confirmada</option>
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="RECHAZADA">Rechazada</option>
                        <option value="EN_ESPERA">En espera</option>
                        <option value="ANULADA">Anulada</option>
                    </select>
                    <button class="btn-recargar" id="admin-recargar">Recargar</button>
                </div>
            </div>
            <div class="recent-table-wrapper">
                <table class="recent-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Alumno</th>
                            <th>Categoria</th>
                            <th>Estado</th>
                            <th>Referencia</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="admin-body">
                        <tr><td colspan="6" class="tabla-cargando">Inicia sesion para ver las matriculas.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="reporte-panel" id="admin-reporte">
            <div class="reporte-card">
                <h2>Reporte mensual</h2>
                <p>Resumen del periodo seleccionado.</p>
                <form id="form-admin-reporte" class="reporte-form">
                    <div class="reporte-fila">
                        <div class="campo">
                            <label for="admin-reporte-anio">Anio</label>
                            <input type="number" id="admin-reporte-anio" min="2020" max="2100" placeholder="2026">
                        </div>
                        <div class="campo">
                            <label for="admin-reporte-mes">Mes</label>
                            <input type="number" id="admin-reporte-mes" min="1" max="12" placeholder="5">
                        </div>
                    </div>
                    <button type="submit" class="btn-reporte">Generar reporte</button>
                </form>
                <div id="admin-reporte-resultado" class="reporte-resultado"></div>
            </div>
        </section>
    </div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
