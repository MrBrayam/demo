spring.application.name=demo

# Conexion a MySQL via XAMPP (puerto 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/tallersoftware?useSSL=false
spring.datasource.username=tallersoftware
spring.datasource.password=71490956@

# JPA / Hibernate
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Desactivar la seguridad por defecto (evita /login automatico)
